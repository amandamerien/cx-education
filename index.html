<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta de gravação — Curso Clickmax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181c;
    --ink-soft:#3a423f;
    --muted:#6d766f;
    --paper:#eef1ea;
    --surface:#ffffff;
    --line:#d9ded4;
    --lime:#cbf24b;
    --lime-deep:#a8cc2c;
    --radius:14px;
    --sans:"Instrument Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

  /* ---------- topo / medidor ---------- */
  .slate{
    background:var(--ink);
    color:#f4f7ee;
    padding:26px 28px 22px;
  }
  .slate-inner{max-width:1180px;margin:0 auto}
  .slate h1{
    font-family:var(--display);
    font-weight:600;
    font-size:19px;
    letter-spacing:-.01em;
    margin:0 0 18px;
    color:#f4f7ee;
  }
  .slate h1 span{color:var(--lime)}
  .count{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .count b{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(52px,11vw,84px);
    line-height:.85;
    letter-spacing:-.04em;
    color:var(--lime);
    font-variant-numeric:tabular-nums;
  }
  .count small{font-size:14px;color:#a9b3a4;padding-bottom:6px;max-width:22ch}
  .segbar{display:flex;gap:3px;margin-top:20px}
  .seg{flex:1;height:8px;background:#2c332e;border-radius:2px;overflow:hidden;position:relative}
  .seg i{display:block;height:100%;background:var(--lime);width:0;transition:width .35s ease}
  .seg-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#8d968a}

  /* ---------- barra de ferramentas ---------- */
  .tools{
    max-width:1180px;margin:0 auto;padding:16px 28px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .tools input[type=search]{
    font-family:inherit;font-size:14px;
    padding:9px 14px;border:1px solid var(--line);border-radius:999px;
    background:var(--surface);color:var(--ink);min-width:220px;flex:1;
  }
  .chip{
    background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13px;color:var(--ink-soft);
  }
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#f4f7ee}
  .ghost{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px 4px}

  /* ---------- corpo ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px 80px;display:grid;grid-template-columns:270px 1fr;gap:34px;align-items:start}
  nav.mods{position:sticky;top:18px}
  .mods ol{list-style:none;margin:0;padding:0}
  .mods li{margin-bottom:2px}
  .modlink{
    width:100%;display:block;text-align:left;background:none;border:none;
    padding:9px 12px;border-radius:10px;line-height:1.3;
  }
  .modlink:hover{background:#e4e8dd}
  .modlink[aria-current=true]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
  .modlink .mi{display:flex;gap:8px;align-items:baseline}
  .modlink .num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:16px}
  .modlink .nm{font-size:13.5px;font-weight:500}
  .modlink .st{display:block;font-size:11.5px;color:var(--muted);margin:3px 0 0 24px;font-variant-numeric:tabular-nums}
  .modlink.done .nm{color:var(--muted)}
  .modlink.done .st{color:var(--lime-deep)}

  main{min-width:0}
  .mhead{margin:2px 0 20px}
  .mhead .kicker{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mhead h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.2vw,34px);letter-spacing:-.02em;margin:6px 0 8px;line-height:1.08}
  .mhead p{margin:0;color:var(--ink-soft);max-width:62ch}

  .rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .row{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row.is-gravada,.row.is-publicada{background:#fbfdf6}
  .row .idx{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row .title{font-size:14.5px;line-height:1.35;border:none;background:none;padding:0;text-align:left;width:100%}
  .row.is-gravada .title,.row.is-publicada .title{color:var(--muted)}
  .actions{display:flex;gap:6px;align-items:center}
  .status{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:5px 12px 5px 9px;font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block;flex:none}
  .status[data-s=roteiro]{border-color:#c9cec3}
  .status[data-s=roteiro] .dot{border-style:dashed;border-color:var(--ink)}
  .status[data-s=gravada]{background:var(--lime);border-color:var(--lime-deep);font-weight:500}
  .status[data-s=gravada] .dot{background:var(--ink);border-color:var(--ink)}
  .status[data-s=publicada]{background:var(--ink);border-color:var(--ink);color:var(--lime);font-weight:500}
  .status[data-s=publicada] .dot{background:var(--lime);border-color:var(--lime)}
  .notebtn{border:1px solid var(--line);background:#fff;border-radius:999px;width:30px;height:30px;font-size:13px;color:var(--muted);line-height:1}
  .notebtn.has{background:var(--ink);color:var(--lime);border-color:var(--ink)}
  .noterow{grid-column:1/-1;padding:0 0 4px 38px}
  .noterow textarea{
    width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fbfcf8;resize:vertical;min-height:62px;
  }
  .addrow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fafbf7}
  .addrow input{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff}
  .addrow button{border:1px solid var(--ink);background:var(--ink);color:var(--lime);border-radius:999px;padding:8px 16px;font-size:13.5px}
  .empty{padding:26px 16px;color:var(--muted);font-size:14px}
  .foot{max-width:1180px;margin:0 auto;padding:0 28px 60px;color:var(--muted);font-size:12.5px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--ink);color:var(--lime);padding:10px 18px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s
  }
  .toast.show{opacity:1}
  @media (max-width:860px){
    .slate{padding:20px 18px}
    .tools{padding:14px 18px}
    .wrap{grid-template-columns:1fr;gap:20px;padding:0 18px 70px}
    nav.mods{position:static}
    .mods ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
    .mods li{margin:0}
    .modlink{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
    .modlink .st{margin-left:0}
    .row{grid-template-columns:22px 1fr;padding:11px 13px}
    .actions{grid-column:2;justify-content:flex-start;margin-top:2px}
    .noterow{padding-left:34px}
    .foot{padding:0 18px 60px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="slate">
  <div class="slate-inner">
    <h1>Pauta de gravação <span>·</span> Curso Clickmax</h1>
    <div class="count">
      <b id="bigCount">—</b>
      <small id="bigLabel">carregando seu progresso…</small>
    </div>
    <div class="segbar" id="segbar"></div>
    <div class="seg-legend"><span>Comece por aqui</span><span>Operação avançada</span></div>
  </div>
</header>

<div class="tools">
  <input type="search" id="q" placeholder="Buscar aula em todos os módulos" aria-label="Buscar aula">
  <button class="chip" data-f="todas" aria-pressed="true">Todas</button>
  <button class="chip" data-f="pendente" aria-pressed="false">A fazer</button>
  <button class="chip" data-f="roteiro" aria-pressed="false">Roteiro</button>
  <button class="chip" data-f="gravada" aria-pressed="false">Gravadas</button>
  <button class="ghost" id="copy">Copiar pauta</button>
  <button class="ghost" id="reset">Zerar</button>
</div>

<div class="wrap">
  <nav class="mods" aria-label="Módulos"><ol id="modlist"></ol></nav>
  <main id="main"></main>
</div>

<p class="foot">Clique no selo de status para avançar: a fazer → roteiro pronto → gravada → publicada. Tudo fica salvo neste navegador.</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CURRICULO = [
  {id:"m0", nome:"Comece por aqui", obj:"Duas aulas curtas que dão o mapa da plataforma e ajudam a pessoa a escolher por onde começar.", aulas:[
    "Boas-vindas: o que você vai conseguir fazer no fim do curso",
    "O mapa da Clickmax: como os módulos se conectam",
    "Escolha sua trilha: quero vender rápido ou quero organizar a operação"
  ]},
  {id:"m1", nome:"Onboarding Express", obj:"Trilha curta para sair do zero até uma venda de teste no ar. Grave esta primeira: ela vira a vitrine do curso.", aulas:[
    "Crie sua conta e configure o workspace",
    "Conheça o painel, a busca e os atalhos",
    "Cadastre seu primeiro produto",
    "Crie a oferta e ligue o checkout",
    "Monte seu primeiro funil",
    "Adicione páginas ao funil",
    "Configure a captura de leads",
    "Conecte o WhatsApp",
    "Crie sua primeira automação",
    "Publique e faça uma venda de teste",
    "Acompanhe leads e vendas no painel"
  ]},
  {id:"m2", nome:"Conta, workspace e configurações", obj:"Tudo que vive em Configurações. Grave em bloco: é a mesma tela do início ao fim.", aulas:[
    "Navegação, busca e organização por projetos",
    "Perfil, senha e dados da conta",
    "Notificações",
    "Conexões e workspaces do usuário",
    "Workspaces da conta e membros",
    "Plano, limites e créditos",
    "Calculadora de créditos e histórico de compras",
    "Domínios: conectar, verificar e usar",
    "Idioma, tema e emissão de notas fiscais",
    "Explorar integrações e integrações ativas"
  ]},
  {id:"m3", nome:"Funis e páginas", obj:"O coração do módulo Marketing: da estrutura do funil até a página publicada.", aulas:[
    "O que é um funil na Clickmax",
    "Crie um funil do zero",
    "Comece de um modelo pronto",
    "Etapas do funil e conexões entre páginas",
    "Crie e edite uma página",
    "Seções, blocos e versão mobile",
    "Conecte formulário, checkout e página de obrigado",
    "Domínio, URL e configurações da página",
    "Redirecionamentos e links curtos",
    "Publique, despublique e duplique",
    "Acompanhe o desempenho do funil"
  ]},
  {id:"m4", nome:"Captação de leads", obj:"Formulários, quizzes, webchat e links — e o que fazer com o contato depois que ele entra.", aulas:[
    "Formulário simples",
    "Quizzes",
    "Webchat bots",
    "Links de captação",
    "Origem e sub-origem: de onde veio cada lead",
    "Campos customizados",
    "Tags, listas e filtros na prática"
  ]},
  {id:"m5", nome:"Mensagens e canais", obj:"Central de contas (conectar canais) e broadcasts (disparar). Uma aula por canal facilita a manutenção depois.", aulas:[
    "Visão geral de Mensagens",
    "Conecte o WhatsApp",
    "Templates de WhatsApp e aprovação da Meta",
    "Conecte o Instagram",
    "Conecte o Telegram",
    "Configure o e-mail remetente",
    "Disparos simplificados: e-mail",
    "Disparos simplificados: WhatsApp, SMS e ligação",
    "Histórico de envio",
    "Agendamento e agentes de IA"
  ]},
  {id:"m6", nome:"Automações", obj:"Separado de Mensagens de propósito: aqui é lógica, não canal.", aulas:[
    "Anatomia de uma automação: gatilho, condição e ação",
    "Crie sua primeira automação",
    "Use as automações recomendadas",
    "Boas-vindas e aquecimento",
    "Abandono de carrinho",
    "Recuperação de vendas",
    "Mais de um canal na mesma jornada",
    "Teste, ative e monitore"
  ]},
  {id:"m7", nome:"Produtos, ofertas e checkout", obj:"Do cadastro do produto ao pedido aprovado, incluindo as alavancas de ticket.", aulas:[
    "Crie um produto",
    "Configurações e imagem do produto",
    "Produtos externos",
    "Produtos afiliados",
    "Crie e configure uma oferta",
    "Preço único, parcelamento e recorrência",
    "Meios de pagamento",
    "Configure o checkout",
    "Personalize o checkout",
    "Cupons de desconto",
    "Order bump",
    "Upsell e downsell",
    "Aprovação da oferta e compra de teste",
    "Co-produção e programa de afiliados"
  ]},
  {id:"m8", nome:"Entregáveis e área de membros", obj:"O que o cliente recebe depois de comprar.", aulas:[
    "Crie uma área de membros",
    "Crie um curso: módulos e aulas",
    "Turmas e liberação de acesso",
    "Ligue a entrega à oferta",
    "Comunidades",
    "Banners",
    "Calendários",
    "Avisos",
    "Comentários",
    "Alunos e membros: acessos e certificados"
  ]},
  {id:"m9", nome:"Contatos e comercial (CRM)", obj:"Para quem vende com atendimento humano. É o módulo mais denso: vale gravar em dois dias.", aulas:[
    "Leads, empresas e visitantes: qual a diferença",
    "A ficha do contato: histórico e atividades",
    "Insights",
    "Crie um pipeline e suas etapas",
    "Crie e movimente uma oportunidade",
    "Responsável, time e acessos do time",
    "Tarefas",
    "Agendamentos",
    "Segmentação: filtros, listas e tags",
    "Campos customizados no CRM",
    "Regras e automações de etapa"
  ]},
  {id:"m10", nome:"Propostas", obj:"Módulo curto e fácil de gravar em uma sentada.", aulas:[
    "Monte um template de proposta",
    "Gere e envie uma proposta",
    "Acompanhe: enviada, visualizada, aceita"
  ]},
  {id:"m11", nome:"Vendas e recuperação", obj:"Leitura do painel financeiro e o dinheiro que dá para trazer de volta.", aulas:[
    "O painel Minhas Vendas",
    "Por venda ou por transação: filtros e colunas",
    "Status de vendas e transações",
    "Exporte suas vendas em .csv",
    "Assinaturas",
    "Cartões recusados e motivos de falha",
    "PIX e boletos em aberto",
    "Abandono de carrinho",
    "Configure a recuperação de vendas",
    "Vendas e recuperação de plataformas externas",
    "Reembolsos e cancelamentos",
    "Afiliados, pacotes compartilhados e indique e ganhe"
  ]},
  {id:"m12", nome:"Operação avançada", obj:"Para quem já domina o básico e quer somar os módulos numa operação só.", aulas:[
    "Funis com teste A/B e condicionais",
    "Segmentações avançadas",
    "Automações com múltiplas condições",
    "Marketing, CRM e vendas na mesma operação",
    "Recuperação multicanal",
    "Vários workspaces e projetos",
    "Equipe, permissões e comissões",
    "Rotina de análise e otimização"
  ]}
];

const ORDEM = ["pendente","roteiro","gravada","publicada"];
const ROTULO = {pendente:"A fazer", roteiro:"Roteiro pronto", gravada:"Gravada", publicada:"Publicada"};
const CHAVE = "pauta-clickmax-v1";

let estado = {status:{}, notas:{}, extras:{}};
let moduloAtivo = CURRICULO[0].id;
let filtro = "todas";
let busca = "";
let notaAberta = null;
let salvando = null;

/* ---------- persistência ---------- */
async function carregar(){
  try{
    const bruto = localStorage.getItem(CHAVE);
    if(bruto){
      const d = JSON.parse(bruto);
      estado = {status:d.status||{}, notas:d.notas||{}, extras:d.extras||{}};
    }
  }catch(e){ /* primeira visita ou storage indisponível */ }
}
function salvar(){
  clearTimeout(salvando);
  salvando = setTimeout(()=>{
    try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }
    catch(e){ aviso("Não consegui salvar agora."); }
  }, 250);
}
function aviso(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1900);
}

/* ---------- dados ---------- */
function aulasDe(mod){
  const base = mod.aulas.map((t,i)=>({id:`${mod.id}-${i}`, titulo:t}));
  const extra = (estado.extras[mod.id]||[]).map(x=>({id:x.id, titulo:x.titulo, extra:true}));
  return base.concat(extra);
}
const st = id => estado.status[id] || "pendente";
const feita = id => ["gravada","publicada"].includes(st(id));

function totais(){
  let t=0, g=0;
  CURRICULO.forEach(m=>aulasDe(m).forEach(a=>{t++; if(feita(a.id)) g++;}));
  return {t,g};
}
function totaisMod(m){
  const as = aulasDe(m);
  return {t:as.length, g:as.filter(a=>feita(a.id)).length};
}

/* ---------- topo ---------- */
function pintarTopo(){
  const {t,g} = totais();
  document.getElementById("bigCount").textContent = `${g}/${t}`;
  document.getElementById("bigLabel").textContent = g===0
    ? `aulas gravadas. ${t} aulas mapeadas em ${CURRICULO.length} módulos.`
    : `aulas gravadas de ${t}. Faltam ${t-g}.`;
  const bar = document.getElementById("segbar");
  bar.innerHTML = "";
  CURRICULO.forEach(m=>{
    const {t:mt,g:mg} = totaisMod(m);
    const s = document.createElement("div");
    s.className = "seg";
    s.title = `${m.nome}: ${mg}/${mt}`;
    s.innerHTML = `<i style="width:${mt? (mg/mt*100):0}%"></i>`;
    bar.appendChild(s);
  });
}

/* ---------- navegação ---------- */
function pintarNav(){
  const ol = document.getElementById("modlist");
  ol.innerHTML = "";
  CURRICULO.forEach((m,i)=>{
    const {t,g} = totaisMod(m);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "modlink" + (t && g===t ? " done" : "");
    b.setAttribute("aria-current", m.id===moduloAtivo ? "true":"false");
    b.innerHTML = `<span class="mi"><span class="num">${i}</span><span class="nm">${m.nome}</span></span>
      <span class="st">${t && g===t ? "✓ concluído" : `${g}/${t} gravadas`}</span>`;
    b.onclick = ()=>{ moduloAtivo = m.id; notaAberta = null; pintarNav(); pintarMain();
      if(window.innerWidth<=860) document.getElementById("main").scrollIntoView({behavior:"smooth",block:"start"}); };
    li.appendChild(b); ol.appendChild(li);
  });
}

/* ---------- conteúdo ---------- */
function visiveis(mod){
  return aulasDe(mod).filter(a=>{
    const s = st(a.id);
    const okF = filtro==="todas" ? true : (filtro==="gravada" ? feita(a.id) : s===filtro);
    const okB = !busca || a.titulo.toLowerCase().includes(busca);
    return okF && okB;
  });
}

function pintarMain(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  if(busca){
    const achados = CURRICULO.map(m=>({m, as:visiveis(m)})).filter(x=>x.as.length);
    const h = document.createElement("div");
    h.className = "mhead";
    const n = achados.reduce((s,x)=>s+x.as.length,0);
    h.innerHTML = `<div class="kicker">busca</div><h2>${n} aula${n===1?"":"s"} para “${busca}”</h2>`;
    main.appendChild(h);
    if(!n){ main.insertAdjacentHTML("beforeend", `<div class="rows"><p class="empty">Nada com esse termo. Limpe a busca para voltar à pauta.</p></div>`); return; }
    achados.forEach(x=>{
      const cap = document.createElement("p");
      cap.className = "kicker";
      cap.style.margin = "18px 0 6px";
      cap.textContent = x.m.nome;
      main.appendChild(cap);
      main.appendChild(bloco(x.m, x.as, false));
    });
    return;
  }

  const mod = CURRICULO.find(m=>m.id===moduloAtivo);
  const idx = CURRICULO.indexOf(mod);
  const {t,g} = totaisMod(mod);
  const h = document.createElement("div");
  h.className = "mhead";
  h.innerHTML = `<div class="kicker">módulo ${idx} · ${t} aulas · ${g} gravadas</div>
    <h2>${mod.nome}</h2><p>${mod.obj}</p>`;
  main.appendChild(h);
  main.appendChild(bloco(mod, visiveis(mod), true));
}

function bloco(mod, aulas, comAdd){
  const box = document.createElement("div");
  box.className = "rows";

  if(!aulas.length){
    box.innerHTML = `<p class="empty">Nenhuma aula neste filtro.</p>`;
  }

  aulas.forEach((a,i)=>{
    const s = st(a.id);
    const row = document.createElement("div");
    row.className = "row is-"+s;

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i+1).padStart(2,"0");

    const tit = document.createElement("span");
    tit.className = "title";
    tit.textContent = a.titulo;

    const acts = document.createElement("span");
    acts.className = "actions";

    const bs = document.createElement("button");
    bs.className = "status";
    bs.dataset.s = s;
    bs.setAttribute("aria-label", `Status: ${ROTULO[s]}. Clique para avançar.`);
    bs.innerHTML = `<span class="dot"></span>${ROTULO[s]}`;
    bs.onclick = ()=>{
      const prox = ORDEM[(ORDEM.indexOf(s)+1) % ORDEM.length];
      if(prox==="pendente") delete estado.status[a.id]; else estado.status[a.id]=prox;
      salvar(); pintarTudo();
    };

    const bn = document.createElement("button");
    bn.className = "notebtn" + (estado.notas[a.id] ? " has":"");
    bn.textContent = "✎";
    bn.setAttribute("aria-label","Nota da aula");
    bn.onclick = ()=>{ notaAberta = notaAberta===a.id ? null : a.id; pintarMain(); };

    acts.append(bs, bn);
    row.append(idx, tit, acts);

    if(a.extra){
      const del = document.createElement("button");
      del.className = "notebtn";
      del.textContent = "×";
      del.setAttribute("aria-label","Remover aula");
      del.onclick = ()=>{
        estado.extras[mod.id] = (estado.extras[mod.id]||[]).filter(x=>x.id!==a.id);
        delete estado.status[a.id]; delete estado.notas[a.id];
        salvar(); pintarTudo();
      };
      acts.appendChild(del);
    }

    if(notaAberta===a.id){
      const nr = document.createElement("div");
      nr.className = "noterow";
      const ta = document.createElement("textarea");
      ta.placeholder = "Roteiro, tela a mostrar, o que falar, pendências…";
      ta.value = estado.notas[a.id] || "";
      ta.oninput = ()=>{
        if(ta.value.trim()) estado.notas[a.id]=ta.value; else delete estado.notas[a.id];
        salvar(); bn.classList.toggle("has", !!ta.value.trim());
        pintarTopo();
      };
      nr.appendChild(ta);
      row.appendChild(nr);
      setTimeout(()=>ta.focus(),0);
    }

    box.appendChild(row);
  });

  if(comAdd){
    const add = document.createElement("div");
    add.className = "addrow";
    const inp = document.createElement("input");
    inp.placeholder = "Adicionar aula neste módulo";
    const bt = document.createElement("button");
    bt.textContent = "Adicionar";
    const go = ()=>{
      const v = inp.value.trim(); if(!v) return;
      (estado.extras[mod.id] = estado.extras[mod.id]||[]).push({id:`${mod.id}-x${Date.now()}`, titulo:v});
      inp.value=""; salvar(); pintarTudo();
    };
    bt.onclick = go;
    inp.onkeydown = e=>{ if(e.key==="Enter") go(); };
    add.append(inp, bt);
    box.appendChild(add);
  }
  return box;
}

function pintarTudo(){ pintarTopo(); pintarNav(); pintarMain(); }

/* ---------- ferramentas ---------- */
document.getElementById("q").addEventListener("input", e=>{
  busca = e.target.value.trim().toLowerCase();
  notaAberta = null; pintarMain();
});
document.querySelectorAll(".chip").forEach(c=>{
  c.onclick = ()=>{
    filtro = c.dataset.f;
    document.querySelectorAll(".chip").forEach(o=>o.setAttribute("aria-pressed", String(o===c)));
    pintarMain();
  };
});
document.getElementById("copy").onclick = async ()=>{
  const marca = {pendente:"[ ]", roteiro:"[~]", gravada:"[x]", publicada:"[✓]"};
  let out = "# Pauta de gravação — Curso Clickmax\n";
  const {t,g} = totais();
  out += `\n${g} de ${t} aulas gravadas.\n`;
  CURRICULO.forEach((m,i)=>{
    const {t:mt,g:mg} = totaisMod(m);
    out += `\n## ${i}. ${m.nome} (${mg}/${mt})\n`;
    aulasDe(m).forEach(a=>{
      out += `${marca[st(a.id)]} ${a.titulo}\n`;
      if(estado.notas[a.id]) out += `    ↳ ${estado.notas[a.id].replace(/\n/g," ")}\n`;
    });
  });
  try{ await navigator.clipboard.writeText(out); aviso("Pauta copiada."); }
  catch(e){ aviso("Não consegui copiar aqui."); }
};
document.getElementById("reset").onclick = ()=>{
  if(!confirm("Isso apaga todos os checks, notas e aulas que você adicionou. Continuar?")) return;
  estado = {status:{}, notas:{}, extras:{}};
  salvar(); pintarTudo(); aviso("Pauta zerada.");
};

(async function(){
  await carregar();
  pintarTudo();
})();
</script>
